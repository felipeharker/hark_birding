# Render Blueprint for the birding report: one static service, built from
# this repository's main branch.
#
# It records the dashboard settings. Render reads this file only if it is
# synced as a Blueprint; until then the dashboard rules, and the two must
# match.
services:
  - type: web
    name: hark-birding
    runtime: static
    repo: https://github.com/felipeharker/hark_birding
    branch: main
    buildCommand: cd web && npm ci && npm run build   # prebuild fetches the shared stylesheet
    staticPublishPath: web/out
    envVars:
      - key: NODE_VERSION                  # Next.js 16 needs 20.9 or newer
        value: "22"
