# Render Blueprint for the birding report: one static service, built from
# this repository's main branch.
#
# It is synced as a Render Blueprint (named after this repository): a push
# that changes it changes the service, and a setting changed in the dashboard
# and not here is overwritten at the next sync.
services:
  - type: web
    name: hark-birding
    runtime: static
    repo: https://github.com/felipeharker/hark_birding
    branch: main
    autoDeployTrigger: checksPass          # deploys a push once its Check workflow passes
    renderSubdomainPolicy: disabled        # served only at its custom domain, not onrender.com
    buildCommand: cd web && npm ci && npm run build   # prebuild fetches the shared stylesheet
    staticPublishPath: web/out
    domains:
      - birds.felipeharker.org             # a Porkbun CNAME to its onrender.com address
    envVars:
      - key: NODE_VERSION                  # Next.js 16 needs 20.9 or newer
        value: "22"
